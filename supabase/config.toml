project_id = "prometheus-athena"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
minimum_password_length = 8

[auth.email]
enable_confirmations = true
otp_length = 8
max_frequency = "1m"

[auth.email.template.confirmation]
subject = "Your ATHENA verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your ATHENA password"
content_path = "./supabase/templates/recovery.html"

[functions.send-welcome-email]
# The handler validates the bearer token with Auth getUser before any mail operation.
verify_jwt = false

[auth.email.notification.password_changed]
enabled = true
subject = "Your ATHENA password changed"
content_path = "./supabase/templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your ATHENA email changed"
content_path = "./supabase/templates/email-changed.html"
